<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="240" viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueprintGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A8D8EA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7FB3D5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5C8A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#A8D8EA;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#2E5C8A;stop-opacity:0.6" />
    </linearGradient>
  </defs>

  <!-- Background (transparent by default, remove rect for transparent version) -->
  <!-- <rect width="800" height="240" fill="#0A1929"/> -->

  <!-- Industrial frame accent - top line -->
  <rect x="40" y="40" width="720" height="2" fill="url(#accentGradient)" opacity="0.8"/>

  <!-- Industrial frame accent - bottom line -->
  <rect x="40" y="200" width="720" height="2" fill="url(#accentGradient)" opacity="0.8"/>

  <!-- Corner accents - top left -->
  <rect x="40" y="40" width="2" height="20" fill="#A8D8EA" opacity="0.8"/>
  <rect x="40" y="40" width="20" height="2" fill="#A8D8EA" opacity="0.8"/>

  <!-- Corner accents - top right -->
  <rect x="758" y="40" width="2" height="20" fill="#A8D8EA" opacity="0.8"/>
  <rect x="740" y="40" width="20" height="2" fill="#A8D8EA" opacity="0.8"/>

  <!-- Corner accents - bottom left -->
  <rect x="40" y="182" width="2" height="20" fill="#2E5C8A" opacity="0.8"/>
  <rect x="40" y="200" width="20" height="2" fill="#2E5C8A" opacity="0.8"/>

  <!-- Corner accents - bottom right -->
  <rect x="758" y="182" width="2" height="20" fill="#2E5C8A" opacity="0.8"/>
  <rect x="740" y="200" width="20" height="2" fill="#2E5C8A" opacity="0.8"/>

  <!-- SELOPS wordmark -->
  <text x="400" y="125" font-family="'Courier New', 'Monaco', 'Consolas', monospace" font-size="72" font-weight="700" fill="url(#blueprintGradient)" text-anchor="middle" letter-spacing="8">
    SELOPS
  </text>

  <!-- Tagline -->
  <text x="400" y="165" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" font-weight="300" fill="#7FB3D5" text-anchor="middle" letter-spacing="2" opacity="0.9">
    AI Engineering · Company Operations · Production Systems
  </text>

  <!-- Subtle grid pattern overlay for blueprint effect -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#A8D8EA" stroke-width="0.2" opacity="0.1"/>
    </pattern>
  </defs>
  <rect x="40" y="40" width="720" height="162" fill="url(#grid)" opacity="0.3"/>
</svg>
